<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP is vendored, not fetched from a CDN: a render-time network fetch is
         both a determinism hazard and unreachable behind this environment's proxy. -->
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #131218; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* Scene slots stretch over the persistent ground. */
      #root > div[data-composition-src] { position: absolute; inset: 0; }
      /* The ground is a full-bleed CHILD — a background on the root itself can
         be dropped by the producer's frame compositing and render black. */
      #hf-ground { position: absolute; inset: 0; background: #131218; }
      #hf-rail { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #332F3E; }
      #hf-rail-fill {
        position: absolute; inset: 0; background: #4A4658;
        transform-origin: 0% 50%; will-change: transform;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="266"
         data-width="1920" data-height="1080" data-fps="30">

      <div id="hf-ground" class="clip" data-start="0" data-duration="266" data-track-index="0"></div>

      <div id="el-s01" data-composition-id="s01"
           data-composition-src="compositions/s01.html"
           data-start="0" data-duration="9" data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="el-s02" data-composition-id="s02"
           data-composition-src="compositions/s02.html"
           data-start="9" data-duration="11" data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <div id="el-s03" data-composition-id="s03"
           data-composition-src="compositions/s03.html"
           data-start="20" data-duration="11" data-track-index="1"

      <div id="hf-rail" class="clip" data-start="0" data-duration="266" data-track-index="2">
        <div id="hf-rail-fill"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var tl = gsap.timeline({ paused: true });
        // One root tween: the progress rail fills once across the whole film.
        tl.fromTo("#hf-rail-fill", { scaleX: 0 }, { scaleX: 1, duration: 266, ease: "none" }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
