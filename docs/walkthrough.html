<title>Two Agents, One Inbox</title>
<style>
  /* ---------------------------------------------------------------
     Tokens. Light is the bare :root. Two accents that never mix —
     brass for the money lane, indigo for the people lane — because
     the thing this system guarantees is that they don't.
     --------------------------------------------------------------- */
  :root {
    --ground:     #EFEEF2;
    --panel:      #FBFAFD;
    --panel-2:    #E7E5EC;
    --ink:        #1A1922;
    --ink-soft:   #55535F;
    --ink-faint:  #8A8794;
    --rule:       #D9D7E1;
    --rule-firm:  #BEBBC9;

    --fin:        #8E5518;
    --fin-wash:   #F4E8D9;
    --fin-edge:   #D8B98F;

    --hr:         #413FA4;
    --hr-wash:    #E4E3F6;
    --hr-edge:    #B3B1E4;

    --neutral-acc:    #4A4757;
    --neutral-wash:   #E3E1E9;

    --warn:       #9E2F24;
    --warn-wash:  #F7E3E0;
    --good:       #2C6349;

    --shadow: 0 1px 2px rgba(26,25,34,.07), 0 12px 34px -18px rgba(26,25,34,.28);

    --serif: Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:     #131218;
      --panel:      #1B1A23;
      --panel-2:    #232130;
      --ink:        #EDEBF3;
      --ink-soft:   #A8A4B4;
      --ink-faint:  #726E80;
      --rule:       #2F2D3A;
      --rule-firm:  #423F51;

      --fin:        #E4A768;
      --fin-wash:   #2A2018;
      --fin-edge:   #6B5233;

      --hr:         #A09EF2;
      --hr-wash:    #1E1D34;
      --hr-edge:    #43418A;

      --neutral-acc:  #B9B5C6;
      --neutral-wash: #24222E;

      --warn:       #EE8878;
      --warn-wash:  #2E1B18;
      --good:       #74C9A0;

      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px -20px rgba(0,0,0,.8);
    }
  }

  :root[data-theme="dark"] {
    --ground:     #131218;
    --panel:      #1B1A23;
    --panel-2:    #232130;
    --ink:        #EDEBF3;
    --ink-soft:   #A8A4B4;
    --ink-faint:  #726E80;
    --rule:       #2F2D3A;
    --rule-firm:  #423F51;

    --fin:        #E4A768;
    --fin-wash:   #2A2018;
    --fin-edge:   #6B5233;

    --hr:         #A09EF2;
    --hr-wash:    #1E1D34;
    --hr-edge:    #43418A;

    --neutral-acc:  #B9B5C6;
    --neutral-wash: #24222E;

    --warn:       #EE8878;
    --warn-wash:  #2E1B18;
    --good:       #74C9A0;

    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px -20px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(18px, 3vw, 40px) clamp(14px, 3vw, 32px) 56px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------------- masthead ---------------- */

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
  }
  .masthead h1 {
    margin: 0;
    font-size: clamp(15px, 1.5vw, 18px);
    font-weight: 600;
    letter-spacing: .01em;
  }
  .masthead .sub {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------------- the stage ---------------- */

  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 860px) {
    .stage { aspect-ratio: 16 / 9.6; }
  }
  @media (max-width: 859px) {
    .stage { min-height: 68vh; }
  }

  .slate {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px clamp(16px, 3vw, 34px);
    border-bottom: 1px solid var(--rule);
    background: var(--panel-2);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    flex: none;
  }
  .slate .act { color: var(--ink-soft); }
  .slate .count { font-variant-numeric: tabular-nums; }

  .frame {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: clamp(18px, 2.6vw, 34px) clamp(18px, 4vw, 58px) clamp(18px, 2.4vw, 30px);
  }

  .rail {
    flex: none;
    height: 2px;
    background: var(--rule);
    position: relative;
  }
  .rail .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: var(--neutral-acc);
  }

  /* ---------------- frame content blocks ---------------- */

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .eyebrow.fin { color: var(--fin); }
  .eyebrow.hr  { color: var(--hr); }

  .claim {
    font-size: clamp(22px, 3.05vw, 36px);
    line-height: 1.16;
    font-weight: 600;
    letter-spacing: -.015em;
    margin: 0 0 14px;
    text-wrap: balance;
    max-width: 22ch;
  }
  .claim.wide { max-width: 30ch; }

  .lede {
    font-size: clamp(15px, 1.4vw, 18px);
    color: var(--ink-soft);
    max-width: 62ch;
    margin: 0 0 14px;
  }
  .lede strong { color: var(--ink); font-weight: 600; }

  .note {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-faint);
    max-width: 78ch;
    margin: 14px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }

  .cols {
    display: grid;
    gap: clamp(14px, 2vw, 26px);
    grid-template-columns: 1fr;
  }
  @media (min-width: 760px) {
    .cols.two   { grid-template-columns: 1fr 1fr; }
    .cols.three { grid-template-columns: repeat(3, 1fr); }
    .cols.aside { grid-template-columns: 1.1fr .9fr; }
  }

  /* cards */
  .card {
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--panel);
    padding: 16px 18px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.005em;
  }
  .card p { margin: 0; font-size: 14.5px; color: var(--ink-soft); }
  .card p + p { margin-top: 8px; }

  .card.fin { border-color: var(--fin-edge); background: var(--fin-wash); }
  .card.fin h3 { color: var(--fin); }
  .card.hr  { border-color: var(--hr-edge);  background: var(--hr-wash); }
  .card.hr h3 { color: var(--hr); }
  .card.bad { border-color: var(--warn); background: var(--warn-wash); }
  .card.bad h3 { color: var(--warn); }

  .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 7px;
  }
  .card.fin .tag { color: var(--fin); }
  .card.hr  .tag { color: var(--hr); }
  .card.bad .tag { color: var(--warn); }

  /* enumerated steps — used only where order is real */
  ol.steps {
    list-style: none;
    counter-reset: s;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  ol.steps li {
    counter-increment: s;
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 14px;
    align-items: start;
  }
  ol.steps li::before {
    content: counter(s, decimal-leading-zero);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--ink-faint);
    padding-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  ol.steps h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  ol.steps p  { margin: 0; font-size: 14.5px; color: var(--ink-soft); max-width: 62ch; }

  ul.plain {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  ul.plain li {
    font-size: 14.5px;
    color: var(--ink-soft);
    padding-left: 18px;
    position: relative;
    max-width: 64ch;
  }
  ul.plain li::before {
    content: "";
    position: absolute;
    left: 0; top: .68em;
    width: 8px; height: 1px;
    background: var(--rule-firm);
  }
  ul.plain li strong { color: var(--ink); font-weight: 600; }

  /* comparison table */
  .tablewrap { overflow-x: auto; }
  table.cmp {
    border-collapse: collapse;
    width: 100%;
    min-width: 560px;
    font-size: 14px;
  }
  table.cmp th, table.cmp td {
    text-align: left;
    vertical-align: top;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
  }
  table.cmp thead th {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--rule-firm);
    font-weight: 400;
  }
  table.cmp tbody th {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--ink-faint);
    font-weight: 400;
    white-space: nowrap;
  }
  table.cmp td { color: var(--ink-soft); }
  table.cmp td.free { color: var(--ink); }
  table.cmp td code, .lede code, ul.plain code, .card p code, ol.steps p code {
    font-family: var(--mono);
    font-size: .88em;
    background: var(--neutral-wash);
    padding: 1px 5px;
    border-radius: 2px;
    color: var(--ink);
  }

  /* terminal */
  .term {
    font-family: var(--mono);
    font-size: clamp(10.5px, .93vw, 12.5px);
    line-height: 1.58;
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 16px 18px;
    overflow-x: auto;
    white-space: pre-wrap;
    color: var(--ink-soft);
    margin: 0;
    tab-size: 2;
  }
  .term .q    { color: var(--ink); font-weight: 600; }
  .term .rf   { color: var(--fin); }
  .term .rh   { color: var(--hr); }
  .term .rb   { color: var(--neutral-acc); }
  .term .ok   { color: var(--good); }
  .term .bad  { color: var(--warn); }
  .term .dim  { color: var(--ink-faint); }
  .term b     { color: var(--ink); font-weight: 600; }

  /* score bars */
  .scores { display: flex; flex-direction: column; gap: 7px; margin: 0; }
  .score {
    display: grid;
    grid-template-columns: 62px 1fr 46px;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .score .bar { height: 7px; background: var(--neutral-wash); border-radius: 1px; overflow: hidden; }
  .score .bar i { display: block; height: 100%; background: var(--rule-firm); }
  .score.fin .bar i { background: var(--fin); }
  .score.fin  > span:first-child { color: var(--fin); }
  .score.hr  .bar i { background: var(--hr); }
  .score.hr   > span:first-child { color: var(--hr); }
  .score .val { text-align: right; font-variant-numeric: tabular-nums; }
  .floor {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin: 9px 0 0;
  }

  /* diagram */
  .figure { width: 100%; overflow-x: auto; }
  .figure svg {
    display: block;
    width: 100%;
    min-width: 620px;
    height: auto;
    max-height: min(50vh, 430px);
  }
  svg .box   { fill: var(--panel); stroke: var(--rule-firm); stroke-width: 1; }
  svg .box-n { fill: var(--neutral-wash); stroke: var(--rule-firm); }
  svg .box-f { fill: var(--fin-wash); stroke: var(--fin-edge); }
  svg .box-h { fill: var(--hr-wash);  stroke: var(--hr-edge); }
  svg .lbl   { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
  svg .lbl-s { font-family: var(--mono); font-size: 10px; fill: var(--ink-faint); }
  svg .lbl-f { fill: var(--fin); }
  svg .lbl-h { fill: var(--hr); }
  svg .wire  { stroke: var(--rule-firm); stroke-width: 1.2; fill: none; }
  svg .wire-d { stroke: var(--rule-firm); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  svg .divider { stroke: var(--rule-firm); stroke-width: 1; stroke-dasharray: 2 4; }

  /* ---------------- transport ---------------- */

  .transport {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--rule-firm);
    border-radius: 2px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn:hover { background: var(--panel-2); color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--neutral-acc); outline-offset: 2px; }
  .btn.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); min-width: 92px; }
  .btn.primary:hover { background: var(--ink-soft); border-color: var(--ink-soft); color: var(--ground); }

  .chapters {
    display: flex;
    gap: 18px;
    flex: 1 1 320px;
    flex-wrap: wrap;
  }
  .chapter { flex: 1 1 140px; min-width: 130px; }
  .chapter .name {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 6px;
    display: block;
  }
  .chapter .ticks { display: flex; gap: 3px; }
  .chapter .ticks button {
    flex: 1;
    height: 12px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    position: relative;
  }
  .chapter .ticks button::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 5px;
    height: 2px;
    background: var(--rule-firm);
    transition: background .18s;
  }
  .chapter .ticks button:hover::after { background: var(--ink-faint); }
  .chapter .ticks button[aria-current="true"]::after { background: var(--ink); height: 3px; top: 4px; }
  .chapter .ticks button.seen::after { background: var(--ink-faint); }
  .chapter .ticks button:focus-visible { outline: 2px solid var(--neutral-acc); outline-offset: 1px; }

  .colophon {
    border-top: 1px solid var(--rule);
    padding-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  /* ---------------- motion ---------------- */

  .reveal { opacity: 0; }
  .stage.live .reveal {
    animation: rise .5s cubic-bezier(.22,.8,.3,1) forwards;
    animation-delay: calc(var(--i, 0) * 110ms);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .stage.live .reveal { opacity: 1; animation: none; transform: none; }
    .rail .fill { transition: none; }
  }
</style>

<div class="shell">

  <header class="masthead">
    <h1>Two Agents, One Inbox</h1>
    <span class="sub">Cherry Host · agent-routing-assessment</span>
  </header>

  <main class="stage" id="stage">
    <div class="slate">
      <span class="act" id="slate-act">The problem</span>
      <span class="count" id="slate-count">01 / 17</span>
    </div>
    <div class="frame" id="frame" aria-live="polite"></div>
    <div class="rail"><i class="fill" id="fill"></i></div>
  </main>

  <div class="transport">
    <button class="btn primary" id="play" aria-label="Play or pause the walkthrough">Pause</button>
    <button class="btn" id="prev" aria-label="Previous frame">&larr; Prev</button>
    <button class="btn" id="next" aria-label="Next frame">Next &rarr;</button>
    <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  </div>

  <footer class="colophon">
    <span>Every figure, score, and terminal block on these frames is copied from a real <code>npm run demo</code> run in Replay Mode.</span>
    <span>Space plays · &larr; &rarr; steps</span>
  </footer>

</div>

<script>
(() => {
  "use strict";

  const bar = (route, val, max) => `
    <div class="score ${route === 'finance' ? 'fin' : route === 'hr' ? 'hr' : ''}">
      <span>${route}</span>
      <span class="bar"><i style="width:${Math.round((val / max) * 100)}%"></i></span>
      <span class="val">${val.toFixed(3)}</span>
    </div>`;

  const scores = (rows) => `<div class="scores">${rows.map(r => bar(r[0], r[1], 1)).join("")}</div>`;

  /* ------------------------------------------------------------------
     The frames. Order is the argument: the problem, then each section
     of the solution in the order it was decided, then the system
     running. Dwell is roughly reading time.
     ------------------------------------------------------------------ */

  const FRAMES = [

  /* ============ ACT I — THE PROBLEM ============ */

  { act: "The problem", dwell: 8000, html: `
    <p class="eyebrow reveal" style="--i:0">A walkthrough in nineteen frames</p>
    <h2 class="claim wide reveal" style="--i:1">Two Specialist Agents behind a deterministic Router.</h2>
    <p class="lede reveal" style="--i:2">A command-line system that takes a business Question and chooses its own
      route to an answer — to the Finance Agent, to the HR Agent, or to a meeting between them — without a human
      deciding which one to ask, and without ever letting the two domains read each other's data.</p>
    <p class="note reveal" style="--i:3">The problem is the one the assessment brief states. The solution is
      broken into the five sections we settled on, each with the decision behind it recorded as an ADR.</p>` },

  { act: "The problem", dwell: 10000, html: `
    <p class="eyebrow reveal" style="--i:0">Frame 02 · The inbox</p>
    <h2 class="claim reveal" style="--i:1">Money Questions and people Questions land in the same inbox.</h2>
    <div class="cols two" style="margin-top:22px">
      <div class="card fin reveal" style="--i:2">
        <span class="tag">A money Question</span>
        <h3>“What did we spend on payroll?”</h3>
        <p>Belongs to Finance. Answering it needs the expense lines and a payroll total.</p>
      </div>
      <div class="card hr reveal" style="--i:3">
        <span class="tag">A people Question</span>
        <h3>“What does Priya Raman earn?”</h3>
        <p>Belongs to HR. Answering it needs one named person's salary.</p>
      </div>
    </div>
    <p class="note reveal" style="--i:4">The operator asking either one should not have to know which department owns it.
      That is the whole reason a Router exists.</p>` },

  { act: "The problem", dwell: 10000, html: `
    <p class="eyebrow reveal" style="--i:0">Frame 03 · The boundary</p>
    <h2 class="claim wide reveal" style="--i:1">But the data behind them cannot be pooled.</h2>
    <p class="lede reveal" style="--i:2">Whoever answers <strong>“what did we spend on payroll?”</strong> must not be
      able to read <strong>what any individual earns</strong>. The two Questions arrive together and their answers
      must come from different places.</p>
    <div class="cols two" style="margin-top:20px">
      <div class="card reveal" style="--i:3">
        <span class="tag">The obvious build</span>
        <h3>One agent with access to everything</h3>
        <p>Answers both kinds of Question on day one — and quietly destroys the boundary, because nothing in it
          distinguishes a payroll total from a salary.</p>
      </div>
      <div class="card reveal" style="--i:4">
        <span class="tag">The other obvious build</span>
        <h3>Two agents and a human choosing</h3>
        <p>Keeps the boundary and hands the routing decision back to the person asking. That is not a system;
          it is two chat windows.</p>
      </div>
    </div>` },

  { act: "The problem", dwell: 12000, html: `
    <p class="eyebrow reveal" style="--i:0">Frame 04 · Three problems sitting behind it</p>
    <h2 class="claim wide reveal" style="--i:1">Splitting the agents creates three new problems.</h2>
    <ol class="steps" style="margin-top:22px">
      <li class="reveal" style="--i:2">
        <div>
          <h3>Some Questions genuinely need both domains</h3>
          <p>“Should we hire more people?” is a headcount Question and a cash Question at once. Neither Specialist
            Agent can answer it alone from its own data, and neither should be allowed to reach wider.</p>
        </div>
      </li>
      <li class="reveal" style="--i:3">
        <div>
          <h3>An agent writing prose about numbers will invent one</h3>
          <p>Sooner or later it states a figure that came from nowhere. In a finance answer that is not a
            cosmetic flaw — someone acts on it.</p>
        </div>
      </li>
      <li class="reveal" style="--i:4">
        <div>
          <h3>The reviewer has no API key, and every call costs money</h3>
          <p>A system that only demonstrates itself by spending money demonstrates itself to nobody. The test

    <p class="note reveal" style="--i:4">Adding a third Specialist Agent is four pieces of data and one line of
      wiring: a Dataset, an array of Scoped Tools, a prompt, an Exemplar Bank. The HR Agent arrived as exactly
      that — touching neither the agent runtime, nor the Router logic, nor the seam. One thing a third agent
      forces open first: <code>both</code> names a pair, and with three domains it no longer does.</p>` },
  ];

  /* ------------------------------------------------------------------ */

  const stage    = document.getElementById("stage");
  const frameEl  = document.getElementById("frame");
  const fillEl   = document.getElementById("fill");
  const actEl    = document.getElementById("slate-act");
  const countEl  = document.getElementById("slate-count");
  const playBtn  = document.getElementById("play");
  const chapters = document.getElementById("chapters");

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let index = 0;
  let playing = !reduced;
  let started = 0;
  let elapsed = 0;
  let raf = null;

  /* chapter rail — one tick per frame, grouped by act */
  const ticks = [];
  const acts = [];
  FRAMES.forEach((f, i) => {
    const last = acts[acts.length - 1];
    if (!last || last.name !== f.act) acts.push({ name: f.act, from: i, to: i });
    else last.to = i;
  });
  acts.forEach(a => {
    const wrap = document.createElement("div");
    wrap.className = "chapter";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = a.name;
    const row = document.createElement("div");
    row.className = "ticks";
    for (let i = a.from; i <= a.to; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", `Frame ${i + 1}: ${a.name}`);
      b.addEventListener("click", () => go(i));
      row.appendChild(b);
      ticks[i] = b;
    }
    wrap.append(name, row);
    chapters.appendChild(wrap);
  });

  const pad = n => String(n).padStart(2, "0");

  function render() {
    const f = FRAMES[index];
    stage.classList.remove("live");
    frameEl.innerHTML = f.html;
    frameEl.scrollTop = 0;
    actEl.textContent = f.act;
    countEl.textContent = `${pad(index + 1)} / ${pad(FRAMES.length)}`;
    // force reflow so the reveal animations restart on every frame
    void frameEl.offsetWidth;
    stage.classList.add("live");
    ticks.forEach((t, i) => {
      t.setAttribute("aria-current", i === index ? "true" : "false");
      t.classList.toggle("seen", i < index);
    });
  }

  function go(i) {
    index = (i + FRAMES.length) % FRAMES.length;
    elapsed = 0;
    started = performance.now();
    render();
  }

  function tick(now) {
    if (playing) {
      const dt = now - started;
      const total = elapsed + dt;
      const dwell = FRAMES[index].dwell;
      fillEl.style.width = `${Math.min(100, (total / dwell) * 100)}%`;
      if (total >= dwell) { go(index + 1); }
    }
    raf = requestAnimationFrame(tick);
  }

  function setPlaying(on) {
    if (on === playing) return;
    if (on) { started = performance.now(); }
    else { elapsed += performance.now() - started; }
    playing = on;
    playBtn.textContent = on ? "Pause" : "Play";
  }

  playBtn.addEventListener("click", () => setPlaying(!playing));
  document.getElementById("next").addEventListener("click", () => { setPlaying(false); go(index + 1); });
  document.getElementById("prev").addEventListener("click", () => { setPlaying(false); go(index - 1); });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "BUTTON" && e.key === " ") return;
    if (e.key === "ArrowRight") { setPlaying(false); go(index + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { setPlaying(false); go(index - 1); e.preventDefault(); }
    else if (e.key === " ") { setPlaying(!playing); e.preventDefault(); }
  });

  playBtn.textContent = playing ? "Pause" : "Play";
  started = performance.now();
  render();
  raf = requestAnimationFrame(tick);
})();
</script>
